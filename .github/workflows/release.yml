name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build To-avif (Release)
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Download & Prepare FFmpeg (libsvtav1 support)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist_bin" -Force | Out-Null
          $ffmpegZip = "$env:TEMP\ffmpeg.zip"
          $ffmpegExt = "$env:TEMP\ffmpeg_ext"
          curl.exe -fL -s -o $ffmpegZip "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegExt -Force
          $ffmpegExe = Get-ChildItem -Path $ffmpegExt -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination "dist_bin\ffmpeg.exe" -Force
          Remove-Item $ffmpegZip -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $ffmpegExt -ErrorAction SilentlyContinue

      - name: Download & Prepare ExifTool (with runtime libraries)
        shell: pwsh
        run: |
          $exifZip = "$env:TEMP\exiftool.zip"
          $exifExt = "$env:TEMP\exiftool_ext"
          curl.exe -fL -s -o $exifZip "https://sourceforge.net/projects/exiftool/files/latest/download"
          Expand-Archive -Path $exifZip -DestinationPath $exifExt -Force
          $exe = Get-ChildItem -Path $exifExt -Filter "exiftool(-k).exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path $exifExt -Filter "exiftool*.exe" -Recurse | Select-Object -First 1
          }
          $filesDir = Get-ChildItem -Path $exifExt -Directory -Filter "exiftool_files" -Recurse | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "dist_bin\exiftool.exe" -Force
          if ($filesDir) {
            Copy-Item $filesDir.FullName -Destination "dist_bin\exiftool_files" -Recurse -Force
          }
          Remove-Item $exifZip -Force -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $exifExt -ErrorAction SilentlyContinue

      - name: Package Distribution Archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $pkgDir = "To-avif"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir\bin" -Force | Out-Null

          Copy-Item "src-tauri\target\release\to-avif.exe" -Destination "$pkgDir\to-avif.exe" -Force
          Copy-Item "dist_bin\*" -Destination "$pkgDir\bin" -Recurse -Force
          Copy-Item "README.md" -Destination "$pkgDir\README.md" -Force
          Copy-Item "LICENSE" -Destination "$pkgDir\LICENSE" -Force
          Copy-Item "THIRD_PARTY_LICENSES.txt" -Destination "$pkgDir\THIRD_PARTY_LICENSES.txt" -Force

          $zipNameWithTag = "To-avif-$tag-windows-x64.zip"
          $zipNameFixed = "To-avif-windows-x64.zip"
          Compress-Archive -Path "$pkgDir\*" -DestinationPath $zipNameWithTag -Force
          Copy-Item $zipNameWithTag -Destination $zipNameFixed -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            To-avif-*-windows-x64.zip
            To-avif-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
