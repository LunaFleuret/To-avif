[package]
name = "to-avif"
version = "0.2.0"
description = "High-Performance Multi-threaded AVIF Batch Converter"
authors = ["LunaFleuret <LunaFleuret@users.noreply.github.com>"]
edition = "2021"

[dependencies]
tauri = { version = "2.2", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-shell = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
rayon = "1.10"
walkdir = "2.5"
filetime = "0.2"
trash = "5.1"
winreg = "0.52"
anyhow = "1.0"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
